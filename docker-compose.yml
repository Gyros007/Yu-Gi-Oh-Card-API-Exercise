services:
  mongo_db:
    image: mongo:latest
    container_name: database_container
    restart: always
    volumes:
      - mongo_db:/data/db
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo_db:27017/test
    depends_on:
      - mongo_db

volumes:
  mongo_db: {}
